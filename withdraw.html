<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw - TaskZone</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f7f2;
  color:#18251d;
  padding-bottom:30px;
}

.header{
  background:#dff8d5;
  padding:22px 18px 30px;
  border-radius:0 0 30px 30px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back{
  color:#18251d;
  text-decoration:none;
  font-weight:bold;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.card{
  background:white;
  margin:18px;
  padding:20px;
  border-radius:22px;
  box-shadow:0 5px 20px #00000010;
}

.balance{
  text-align:center;
}

.balance-title{
  color:#777;
  font-size:14px;
}

.balance-money{
  margin-top:8px;
  font-size:34px;
  font-weight:bold;
  color:#20b638;
}

h2{
  font-size:21px;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
  margin-bottom:16px;
  background:white;
}

.withdraw-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#32c936;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.withdraw-btn:disabled{
  background:#aaa;
}

.info{
  background:#f1faee;
  padding:14px;
  border-radius:14px;
  color:#66736a;
  font-size:13px;
  line-height:1.7;
}

.history-item{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.history-item:last-child{
  border-bottom:0;
}

.empty{
  color:#888;
  text-align:center;
  padding:10px 0;
  font-size:14px;
}

.status{
  color:#e79b00;
  font-size:13px;
  margin-top:4px;
}
</style>
</head>

<body>

<div class="header">

  <div class="top">

    <a class="back" href="profile.html">
      ← Profile
    </a>

    <div class="logo">
      🌱 TaskZone
    </div>

  </div>

</div>


<div class="card balance">

  <div class="balance-title">
    Available Balance
  </div>

  <div class="balance-money" id="withdrawBalance">
    ৳0.00
  </div>

</div>


<div class="card">

  <h2>💰 Withdraw Money</h2>

  <label for="method">
    Payment Method
  </label>

  <select id="method">
    <option value="">Select Method</option>
    <option value="bKash">bKash</option>
    <option value="Nagad">Nagad</option>
  </select>


  <label for="number">
    Account Number
  </label>

  <input
    type="tel"
    id="number"
    placeholder="01XXXXXXXXX"
    maxlength="11"
  >


  <label for="amount">
    Withdraw Amount
  </label>

  <input
    type="number"
    id="amount"
    placeholder="Minimum ৳50"
    min="50"
    step="1"
  >


  <button
    class="withdraw-btn"
    id="withdrawBtn"
    onclick="requestWithdraw()"
  >
    Request Withdraw
  </button>

</div>


<div class="card">

  <div class="info">
    Minimum withdrawal: ৳50<br>
    Withdrawal fee: ৳5<br>
    Minimum balance required: ৳55<br>
    Supported methods: bKash and Nagad<br>
    Withdrawal requests are reviewed before payment.
  </div>

</div>


<div class="card">

  <h2>📋 Withdrawal History</h2>

  <div id="history">
    <div class="empty">
      No withdrawal requests yet.
    </div>
  </div>

</div>


<script>

const MIN_WITHDRAW = 50;
const WITHDRAW_FEE = 5;
const MIN_BALANCE_REQUIRED = MIN_WITHDRAW + WITHDRAW_FEE;


function getBalance(){

  return Number(
    localStorage.getItem("taskzone_balance") || "0"
  );

}


function saveBalance(balance){

  localStorage.setItem(
    "taskzone_balance",
    balance.toFixed(2)
  );

}


function showBalance(){

  const balance = getBalance();

  document.getElementById(
    "withdrawBalance"
  ).textContent =
    "৳" + balance.toFixed(2);


  const button =
    document.getElementById("withdrawBtn");


  if(balance < MIN_BALANCE_REQUIRED){

    button.disabled = true;
    button.textContent = "Need ৳55 Balance";

  }else{

    button.disabled = false;
    button.textContent = "Request Withdraw";

  }

}


function getHistory(){

  return JSON.parse(
    localStorage.getItem(
      "taskzone_withdraw_history"
    ) || "[]"
  );

}


function saveHistory(history){

  localStorage.setItem(
    "taskzone_withdraw_history",
    JSON.stringify(history)
  );

}


function showHistory(){

  const history = getHistory();

  const box =
    document.getElementById("history");


  if(history.length === 0){

    box.innerHTML =
      '<div class="empty">No withdrawal requests yet.</div>';

    return;

  }


  box.innerHTML = "";


  history.forEach(function(item){

    const div =
      document.createElement("div");

    div.className =
      "history-item";


    div.innerHTML =
      "<strong>" +
      item.method +
      "</strong><br>" +

      "Account: " +
      item.number +
      "<br>" +

      "Withdrawal: ৳" +
      Number(item.amount).toFixed(2) +
      "<br>" +

      "Fee: ৳" +
      Number(item.fee).toFixed(2) +
      "<br>" +

      "Total deducted: ৳" +
      Number(item.total).toFixed(2) +

      "<div class='status'>" +
      "Pending review" +
      "</div>";


    box.appendChild(div);

  });

}


function requestWithdraw(){

  const method =
    document.getElementById("method").value;

  const number =
    document.getElementById("number").value.trim();

  const amount =
    Number(
      document.getElementById("amount").value
    );

  const balance =
    getBalance();


  if(method === ""){

    alert(
      "Please select bKash or Nagad."
    );

    return;

  }


  if(!/^01[0-9]{9}$/.test(number)){

    alert(
      "Please enter a valid 11-digit number."
    );

    return;

  }


  if(!Number.isFinite(amount)){

    alert(
      "Please enter a withdrawal amount."
    );

    return;

  }


  if(amount < MIN_WITHDRAW){

    alert(
      "Minimum withdrawal is ৳50."
    );

    return;

  }


  const totalDeduction =
    amount + WITHDRAW_FEE;


  if(balance < MIN_BALANCE_REQUIRED){

    alert(
      "You need at least ৳55 balance to withdraw."
    );

    return;

  }


  if(totalDeduction > balance){

    alert(
      "Insufficient balance.\n\n" +
      "Withdrawal: ৳" + amount.toFixed(2) +
      "\nFee: ৳" + WITHDRAW_FEE.toFixed(2) +
      "\nTotal required: ৳" + totalDeduction.toFixed(2)
    );

    return;

  }


  const history =
    getHistory();


  history.unshift({

    method: method,

    number: number,

    amount: amount,

    fee: WITHDRAW_FEE,

    total: totalDeduction,

    date: new Date().toLocaleString(),

    status: "Pending"

  });


  saveHistory(history);


  // Withdrawal amount + fee are deducted together
  saveBalance(
    balance - totalDeduction
  );


  document.getElementById("method").value = "";

  document.getElementById("number").value = "";

  document.getElementById("amount").value = "";


  showBalance();

  showHistory();


  alert(
    "Withdrawal request submitted!\n\n" +
    "Method: " + method +
    "\nWithdrawal: ৳" + amount.toFixed(2) +
    "\nFee: ৳" + WITHDRAW_FEE.toFixed(2) +
    "\nTotal deducted: ৳" + totalDeduction.toFixed(2) +
    "\n\nStatus: Pending review"
  );

}
localStorage.setItem("taskzone_balance", "55.00");

showBalance();

showHistory();

</script>

</body>
</html>
