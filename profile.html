<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - TaskZone</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f7f2;
  color:#18251d;
  padding-bottom:90px;
}

.header{
  background:#dff8d5;
  padding:22px 18px 30px;
  border-radius:0 0 30px 30px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.back{
  color:#18251d;
  text-decoration:none;
  font-weight:bold;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.profile{
  text-align:center;
  margin-top:25px;
}

.avatar{
  width:82px;
  height:82px;
  margin:auto;
  border-radius:50%;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  box-shadow:0 4px 15px #00000012;
}

.profile h1{
  margin-top:12px;
  font-size:24px;
}

.profile p{
  margin-top:5px;
  color:#68746b;
}

.card{
  background:white;
  margin:18px;
  padding:20px;
  border-radius:22px;
  box-shadow:0 5px 20px #00000010;
}

.balance{
  text-align:center;
}

.balance-title{
  color:#777;
  font-size:14px;
}

.balance-money{
  margin-top:7px;
  font-size:34px;
  font-weight:bold;
  color:#20b638;
}

.stats{
  display:flex;
  justify-content:space-around;
  text-align:center;
}

.stat-number{
  font-size:22px;
  font-weight:bold;
}

.stat-name{
  margin-top:5px;
  color:#777;
  font-size:13px;
}

.menu{
  display:block;
  padding:16px 0;
  border-bottom:1px solid #eee;
  text-decoration:none;
  color:#18251d;
  font-weight:bold;
}

.menu:last-child{
  border-bottom:0;
}

.menu span{
  margin-right:10px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:72px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -4px 18px #00000012;
}

.bottom a{
  text-decoration:none;
  color:#777;
  text-align:center;
  font-size:12px;
}

.bottom .active{
  color:#20b638;
  font-weight:bold;
}

.bottom span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<div class="header">

  <div class="top">
    <a class="back" href="index.html">← Home</a>
    <div class="logo">🌱 TaskZone</div>
  </div>

  <div class="profile">

    <div class="avatar">👤</div>

    <h1>My Profile</h1>

    <p>Welcome to TaskZone</p>

  </div>

</div>


<div class="card balance">

  <div class="balance-title">
    Current Balance
  </div>

  <div class="balance-money">
    ৳0.00
  </div>

</div>


<div class="card">

  <div class="stats">

    <div>
      <div class="stat-number">0</div>
      <div class="stat-name">Tasks</div>
    </div>

    <div>
      <div class="stat-number">0</div>
      <div class="stat-name">Invites</div>
    </div>

    <div>
      <div class="stat-number">৳0</div>
      <div class="stat-name">Earned</div>
    </div>

  </div>

</div>


<div class="card">

  <a class="menu" href="Tasks.html">
    <span>🎯</span> My Tasks
  </a>

  <a class="menu" href="invite.html">
    <span>👥</span> Invite Friends
  </a>

  <a class="menu" href="withdraw.html">
    <span>💰</span> Withdraw
</a>
  <a class="menu" href="#">
    <span>⚙️</span> Settings
  </a>

</div>


<div class="bottom">

  <a href="index.html">
    <span>⌂</span>
    Home
  </a>

  <a href="Tasks.html">
    <span>☷</span>
    Tasks
  </a>

  <a href="invite.html">
    <span>☆</span>
    Invite
  </a>

  <a class="active" href="profile.html">
    <span>♙</span>
    Profile
  </a>

</div>

</body>
</html>
