<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks - TaskZone</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f7f2;
  color:#18251d;
  padding-bottom:90px;
}

.header{
  background:#dff8d5;
  padding:22px 18px 28px;
  border-radius:0 0 28px 28px;
}

.back{
  text-decoration:none;
  color:#18251d;
  font-size:18px;
  font-weight:bold;
}

.title{
  margin-top:25px;
  font-size:30px;
  font-weight:bold;
}

.subtitle{
  margin-top:8px;
  color:#66736a;
}

.balance{
  margin:18px;
  padding:20px;
  background:white;
  border-radius:22px;
  text-align:center;
  box-shadow:0 5px 20px #00000010;
}

.balance-title{
  color:#777;
  font-size:14px;
}

.balance-money{
  margin-top:7px;
  font-size:32px;
  font-weight:bold;
  color:#20b638;
}

.card{
  margin:18px;
  padding:18px;
  background:white;
  border-radius:22px;
  box-shadow:0 5px 20px #00000010;
}

.task{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px 0;
  border-bottom:1px solid #eee;
}

.task:last-child{
  border-bottom:0;
}

.left{
  display:flex;
  align-items:center;
}

.icon{
  width:48px;
  height:48px;
  background:#e5f8df;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  margin-right:12px;
}

.name{
  font-weight:bold;
  font-size:16px;
}

.reward{
  color:#25b52d;
  margin-top:5px;
  font-size:13px;
}

.start{
  background:#32c936;
  color:white;
  border:0;
  padding:11px 17px;
  border-radius:12px;
  font-weight:bold;
  text-decoration:none;
}

.start.completed{
  background:#777;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -5px 20px #00000012;
}

.nav a{
  text-decoration:none;
  text-align:center;
  color:#777;
  font-size:12px;
}

.nav .active{
  color:#20b82b;
  font-weight:bold;
}

.nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<div class="header">

  <a class="back" href="index.html">
    ← Home
  </a>

  <div class="title">
    Task Center 🎯
  </div>

  <div class="subtitle">
    Complete available tasks and earn rewards.
  </div>

</div>


<div class="balance">

  <div class="balance-title">
    Available Balance
  </div>

  <div class="balance-money" id="balance">
    ৳0.00
  </div>

</div>


<div class="card">

  <!-- Daily Check-in -->
  <div class="task">

    <div class="left">

      <div class="icon">
        📱
      </div>

      <div>
        <div class="name">
          Daily Check-in
        </div>

        <div class="reward">
          Reward ৳5
        </div>
      </div>

    </div>

    <button
      class="start"
      id="dailyCheckin"
      onclick="completeTask('dailyCheckin',5)"
    >
      Start
    </button>

  </div>


  <!-- Daily Bonus -->
  <div class="task">

    <div class="left">

      <div class="icon">
        🎁
      </div>

      <div>
        <div class="name">
          Daily Bonus
        </div>

        <div class="reward">
          Reward ৳3
        </div>
      </div>

    </div>

    <button
      class="start"
      id="dailyBonus"
      onclick="completeTask('dailyBonus',3)"
    >
      Start
    </button>

  </div>


  <!-- Special Task -->
  <div class="task">

    <div class="left">

      <div class="icon">
        ⭐
      </div>

      <div>
        <div class="name">
          Special Task
        </div>

        <div class="reward">
          Reward ৳10
        </div>
      </div>

    </div>

    <button
      class="start"
      id="specialTask"
      onclick="completeTask('specialTask',10)"
    >
      Start
    </button>

  </div>


  <!-- Invite -->
  <div class="task">

    <div class="left">

      <div class="icon">
        👥
      </div>

      <div>
        <div class="name">
          Invite Friends
        </div>

        <div class="reward">
          Referral reward
        </div>
      </div>

    </div>

    <a
      class="start"
      href="invite.html"
    >
      Invite
    </a>

  </div>

</div>


<div class="nav">

  <a href="index.html">
    <span>⌂</span>
    Home
  </a>

  <a class="active" href="Tasks.html">
    <span>☷</span>
    Tasks
  </a>

  <a href="invite.html">
    <span>☆</span>
    Invite
  </a>

  <a href="profile.html">
    <span>♙</span>
    Profile
  </a>

</div>


<script>

/* =========================
   BALANCE
========================= */

function getBalance(){

  return Number(
    localStorage.getItem("taskzone_balance") || "0"
  );

}


function saveBalance(balance){

  localStorage.setItem(
    "taskzone_balance",
    balance.toFixed(2)
  );

}


function showBalance(){

  const balance = getBalance();

  document.getElementById("balance").textContent =
    "৳" + balance.toFixed(2);

}


/* =========================
   TASK STATUS
========================= */

function taskCompleted(taskId){

  return localStorage.getItem(
    "task_" + taskId
  ) === "completed";

}


function setTaskCompleted(taskId){

  localStorage.setItem(
    "task_" + taskId,
    "completed"
  );

}


/* =========================
   COMPLETE TASK
========================= */

function completeTask(taskId,reward){

  const button =
    document.getElementById(taskId);


  if(taskCompleted(taskId)){

    alert("You have already completed this task.");

    return;

  }


  let balance =
    getBalance();


  balance =
    balance + Number(reward);


  saveBalance(balance);


  setTaskCompleted(taskId);


  button.textContent =
    "Completed";

  button.classList.add(
    "completed"
  );

  button.disabled =
    true;


  showBalance();


  alert(
    "Task completed!\n\n" +
    "Reward added: ৳" +
    reward +
    "\n\n" +
    "New balance: ৳" +
    balance.toFixed(2)
  );

}


/* =========================
   RESTORE TASKS
========================= */

function restoreTasks(){

  const tasks = [
    "dailyCheckin",
    "dailyBonus",
    "specialTask"
  ];


  tasks.forEach(function(taskId){

    if(taskCompleted(taskId)){

      const button =
        document.getElementById(taskId);


      button.textContent =
        "Completed";

      button.classList.add(
        "completed"
      );

      button.disabled =
        true;

    }

  });

}


/* =========================
   START
========================= */

showBalance();

restoreTasks();

</script>

</body>
</html>
