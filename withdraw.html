<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Withdraw - TaskZone</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f7f2;
  color:#18251d;
  padding-bottom:30px;
}

.header{
  background:#dff8d5;
  padding:22px 18px 30px;
  border-radius:0 0 30px 30px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back{
  color:#18251d;
  text-decoration:none;
  font-weight:bold;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.card{
  background:white;
  margin:18px;
  padding:20px;
  border-radius:22px;
  box-shadow:0 5px 20px #00000010;
}

.balance{
  text-align:center;
}

.balance-title{
  color:#777;
  font-size:14px;
}

.balance-money{
  margin-top:8px;
  font-size:34px;
  font-weight:bold;
  color:#20b638;
}

h2{
  font-size:21px;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:15px;
  margin-bottom:16px;
  background:white;
}

input:focus,
select:focus{
  border-color:#32c936;
}

.withdraw-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:13px;
  background:#32c936;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.info{
  background:#f1faee;
  padding:14px;
  border-radius:14px;
  color:#66736a;
  font-size:13px;
  line-height:1.6;
}

.history{
  margin-top:18px;
}

.history-item{
  padding:14px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
}

.history-item:last-child{
  border-bottom:0;
}

.pending{
  color:#e79b00;
  font-size:13px;
}

.empty{
  color:#888;
  text-align:center;
  padding:10px 0;
  font-size:14px;
}
</style>
</head>

<body>

<div class="header">

  <div class="top">

    <a class="back" href="profile.html">
      ← Profile
    </a>

    <div class="logo">
      🌱 TaskZone
    </div>

  </div>

</div>


<div class="card balance">

  <div class="balance-title">
    Available Balance
  </div>

  <div class="balance-money">
    ৳0.00
  </div>

</div>


<div class="card">

  <h2>💰 Withdraw Money</h2>

  <label for="method">
    Payment Method
  </label>

  <select id="method">
    <option value="">Select Method</option>
    <option value="bkash">bKash</option>
    <option value="nagad">Nagad</option>
  </select>


  <label for="number">
    Account Number
  </label>

  <input
    type="tel"
    id="number"
    placeholder="01XXXXXXXXX"
    maxlength="11"
  >


  <label for="amount">
    Withdraw Amount
  </label>

  <input
    type="number"
    id="amount"
    placeholder="Enter amount"
    min="1"
  >


  <button class="withdraw-btn" onclick="requestWithdraw()">
    Request Withdraw
  </button>

</div>


<div class="card">

  <div class="info">
    Minimum withdrawal: ৳50<br>
    Withdrawal requests are reviewed before payment.
  </div>

</div>


<div class="card history">

  <h2>📋 Withdrawal History</h2>

  <div class="empty">
    No withdrawal requests yet.
  </div>

</div>


<script>

function requestWithdraw(){

  const method = document.getElementById("method").value;
  const number = document.getElementById("number").value.trim();
  const amount = document.getElementById("amount").value;

  if(method === ""){
    alert("Please select a payment method.");
    return;
  }

  if(number.length !== 11 || !number.startsWith("01")){
    alert("Please enter a valid 11-digit account number.");
    return;
  }

  if(amount === "" || Number(amount) < 50){
    alert("Minimum withdrawal amount is ৳50.");
    return;
  }

  alert(
    "Your withdrawal request has been submitted for review."
  );

}

</script>

</body>
</html>
